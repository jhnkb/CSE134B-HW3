    <main>
        <h1>contact me</h1>

        <img src="images/mail.svg" alt="Email icon" class="contact-icon">
        <a href="mailto:jbolibol@ucsd.edu">
            <span class="email">jbolibol@ucsd.edu</span>
        </a>

        <img src="images/map-pin.svg" alt="Location icon" class="contact-icon">
        <span class="location">San Diego, CA</span>

        <form id="contact" action="#" method="post">
            <fieldset>
                <legend>Send me a message!</legend>
                <label for="name">name:</label>

                <input type="text" id="name" name="name" required>

                <label for="email">email</label>

                <input type="email" id="email" name="email" required>

                <label for="message">message</label>

                <textarea id="message" name="message" rows="5" cols="40"></textarea>

                <button type="submit">submit</button>
            </fieldset>
        </form>
